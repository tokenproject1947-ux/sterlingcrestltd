<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sterling Crest Ltd">
  <!-- Brand tile: Sterling Crest green, rgb(77, 169, 44) -->
  <rect x="20" y="70" width="160" height="160" rx="42" fill="#4DA92C"/>
  <rect x="23" y="73" width="154" height="154" rx="39" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="6"/>

  <!-- Crest: diamond outline (the established identity) with a solid core -->
  <g transform="rotate(45 100 150)">
    <rect x="63" y="113" width="74" height="74" rx="22" fill="none" stroke="#ffffff" stroke-width="13"/>
    <rect x="86" y="136" width="28" height="28" rx="9" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="150" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" fill="#17202e" letter-spacing="1">Sterling Crest</text>
  <text x="234" y="222" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="500" fill="#748093" letter-spacing="7">Ltd</text>
</svg>
